name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install development tools
        run: python -m pip install --quiet -e . pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
